name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 24] # 24 is what the npm publish job builds on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Verify "main" and "types" resolve to built files
        run: node -e "require('.'); require('fs').accessSync(require('./package.json').types)"

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    # Publishes through npm trusted publishing (OIDC), so no NPM_TOKEN is used.
    # The trusted publisher on npmjs.com is tied to this file name (npm.yml):
    # renaming this workflow breaks publishing until the connection is recreated.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # trusted publishing needs npm >= 11.5.1
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      # Skips publishing when this version is already on npm.
      # Pinned to a commit because this step can publish the package.
      - uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5

  publish-github:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
          scope: '@rajuahmed1705'
      - run: npm ci
      - run: npm run build
      - name: Update package name for GitHub Packages
        run: |
          sed -i 's/"@bangladeshi\/bangladesh-address"/"@rajuahmed1705\/bangladesh-address"/' package.json
      - name: Publish (skipped when this version is already on GitHub Packages)
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "@rajuahmed1705/bangladesh-address@$version" version 2>/dev/null)" ]; then
            echo "@rajuahmed1705/bangladesh-address@$version is already published, skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
